<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organigramme Grist</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root { --bg:#f6f7f9; --ink:#1d2733; --muted:#6a7787; --line:#d8dde4; --accent:#1f5fbf; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font:13px/1.35 "Segoe UI", system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  #vp { position:absolute; inset:0; overflow:hidden; cursor:grab; touch-action:none;
        background-image:radial-gradient(#d5dae1 1px, transparent 1px); background-size:22px 22px; }
  #vp.drag { cursor:grabbing; }
  #stage { position:absolute; left:0; top:0; transform-origin:0 0; }
  #edges { position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; }
  .card { position:absolute; padding:8px 12px; overflow:hidden; border:1.5px solid; display:flex; flex-direction:column; justify-content:center; gap:2px; cursor:pointer; user-select:none; }
  .card.sel { outline:3px solid #e07b00; outline-offset:2px; }
  .card.ellipse, .card.pill { text-align:center; align-items:center; }
  .card.ellipse { padding:8px 28px; }
  .card .t { font-weight:650; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .card .f { font-size:12px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .card .f b { font-weight:600; opacity:.7; margin-right:4px; }
  .chips { display:flex; gap:4px; flex-wrap:nowrap; overflow:hidden; margin-top:3px; }
  .chip { font:inherit; font-size:11px; border:1px solid currentColor; background:transparent; color:inherit; border-radius:10px; padding:0 7px; cursor:pointer; opacity:.8; white-space:nowrap; max-width:110px; overflow:hidden; text-overflow:ellipsis; }
  .chip:hover { opacity:1; background:rgba(255,255,255,.35); }
  #bar { position:absolute; top:10px; left:10px; display:flex; gap:6px; z-index:5; }
  #bar button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 10px; cursor:pointer; }
  #bar button:hover { border-color:var(--accent); color:var(--accent); }
  #msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; color:var(--muted); text-align:center; padding:40px; pointer-events:none; }
  #panel { position:absolute; top:0; right:0; bottom:0; width:310px; background:#fff; border-left:1px solid var(--line); overflow:auto; padding:14px 16px 30px; transform:translateX(100%); transition:transform .2s; z-index:10; }
  #panel.open { transform:none; box-shadow:-6px 0 24px rgba(0,0,0,.08); }
  #panel h2 { font-size:13px; margin:18px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line); }
  #panel h2:first-of-type { margin-top:8px; }
  #panel .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:7px 0; }
  #panel .row > span { color:var(--muted); }
  #panel select, #panel input[type=number] { width:150px; font:inherit; padding:3px 5px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  #panel input[type=color] { width:44px; height:26px; padding:0; border:1px solid var(--line); border-radius:4px; }
  #panel .multi { display:grid; gap:3px; margin:4px 0 8px; max-height:150px; overflow:auto; padding:6px 8px; border:1px solid var(--line); border-radius:4px; }
  #panel .multi label { display:flex; gap:6px; align-items:center; }
  #close { float:right; border:0; background:none; font-size:18px; cursor:pointer; color:var(--muted); }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b2027; --ink:#e6eaf0; --muted:#9aa6b5; --line:#343c47; }
    #vp { background-image:radial-gradient(#2b323b 1px, transparent 1px); }
    #bar button, #panel, #panel select, #panel input[type=number] { background:#232a33; color:var(--ink); } }
</style>
</head>
<body>
<div id="vp"><div id="stage"><svg id="edges"></svg><div id="nodes"></div></div></div>
<div id="msg"></div>
<div id="bar">
  <button id="b-cfg" title="Configurer">⚙ Configurer</button>
  <button id="b-fit" title="Ajuster à la fenêtre">Ajuster</button>
  <button id="b-in">+</button><button id="b-out">−</button>
</div>
<aside id="panel"></aside>

<script>
const $ = s => document.querySelector(s);
const PALETTE = ['#cfe3f7','#f9d9c5','#d5ead0','#f3dcef','#fbeab0','#d3d9f0','#f5cfd2','#cbe9e6'];
const DASH = { solid:'', dashed:'8 5', dotted:'1 6' };

const D = { orient:'TB', gapB:24, gapD:64,
  title:null, fields:null, shape:'round', w:230, fillMode:'depth', fill:'#cfe3f7', colorCol:null, border:'#1f3a5f', showParents:true,
  parentCol:null, keyCol:'id', eShape:'elbow', eColor:'#5b6b7f', eWidth:2, eDash:'solid', arrow:true, secondary:true };

const SCHEMA = [
 ['Organigramme', [
  ['orient','Orientation','sel',[['TB','Vertical (haut → bas)'],['BT','Vertical inversé'],['LR','Horizontal (gauche → droite)'],['RL','Horizontal inversé']]],
  ['gapB','Espace entre frères (px)','num'],
  ['gapD','Espace entre niveaux (px)','num']]],
 ['Vignettes', [
  ['title','Colonne du titre','col'],
  ['fields','Colonnes affichées','multi'],
  ['shape','Forme','sel',[['round','Arrondie'],['rect','Rectangle'],['pill','Pilule'],['ellipse','Ellipse'],['accent','Barre latérale']]],
  ['w','Largeur (px)','num'],
  ['fillMode','Couleur de fond','sel',[['fixed','Unique'],['depth','Selon le niveau'],['column','Selon une colonne']]],
  ['fill','Couleur unique','color'],
  ['colorCol','Colonne pour la couleur','col'],
  ['border','Couleur du contour','color'],
  ['showParents','Afficher les liens vers les parents','chk']]],
 ['Liens père / fils', [
  ['parentCol','Colonne parent','col'],
  ['keyCol','Colonne identifiant du parent','colid'],
  ['eShape','Forme des traits','sel',[['elbow','Angles droits'],['curve','Courbes'],['line','Droits']]],
  ['eColor','Couleur des traits','color'],
  ['eWidth','Épaisseur','num'],
  ['eDash','Style','sel',[['solid','Continu'],['dashed','Tirets'],['dotted','Pointillés']]],
  ['arrow','Flèche vers le fils','chk'],
  ['secondary','Afficher les parents secondaires','chk']]]
];

let recs = [], cols = [], cfg = { ...D }, view = { x:0, y:0, k:1 }, needFit = true, sel = null, lastSaved = '', saveT, size = { w:1, h:1 }, laid = new Map();

/* ---------- utilitaires ---------- */
function fmt(v) {
  if (v === null || v === undefined || v === '') return '';
  if (Array.isArray(v)) return (v[0] === 'L' ? v.slice(1) : v).join(', ');
  if (v instanceof Date) return v.toLocaleDateString('fr-FR');
  if (typeof v === 'boolean') return v ? 'Oui' : 'Non';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}
const lum = h => { const n = parseInt(h.slice(1), 16); return (0.299*(n>>16) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255; };
function guess() {
  if (!cols.length) return;
  if (cfg.title == null || !cols.includes(cfg.title)) cfg.title = cols.find(c => /^(nom|name|titre|title|label)/i.test(c)) || cols[0];
  if (cfg.parentCol == null) cfg.parentCol = cols.find(c => /parent|manager|sup[ée]rieur|chef|n\+1|reports/i.test(c)) || null;
  if (cfg.fields == null) cfg.fields = cols.filter(c => c !== cfg.title && c !== cfg.parentCol).slice(0, 2);
}
function save() {
  lastSaved = JSON.stringify(cfg);
  clearTimeout(saveT);
  saveT = setTimeout(() => grist.setOptions(cfg), 300);
}

/* ---------- panneau de configuration ---------- */
function buildPanel() {
  const p = $('#panel'); p.innerHTML = '<button id="close" title="Fermer">×</button>';
  $('#close').onclick = () => p.classList.remove('open');
  const refit = ['orient','w','gapB','gapD','parentCol','keyCol'];
  const change = (k, v) => { cfg[k] = v; save(); if (refit.includes(k)) needFit = true; render(); };
  for (const [name, items] of SCHEMA) {
    p.insertAdjacentHTML('beforeend', `<h2>${name}</h2>`);
    for (const [k, label, type, opts] of items) {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<span>${label}</span>`;
      let el;
      if (type === 'sel' || type === 'col' || type === 'colid') {
        el = document.createElement('select');
        let o = type === 'sel' ? opts : cols.map(c => [c, c]);
        if (type === 'col') o = [['', '(aucune)'], ...o];
        if (type === 'colid') o = [['id', 'Numéro de ligne (id)'], ...o];
        el.innerHTML = o.map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
        el.value = cfg[k] ?? '';
        el.onchange = () => change(k, el.value === '' ? null : el.value);
      } else if (type === 'num') {
        el = document.createElement('input'); el.type = 'number'; el.value = cfg[k]; el.min = 0;
        el.oninput = () => change(k, +el.value);
      } else if (type === 'color') {
        el = document.createElement('input'); el.type = 'color'; el.value = cfg[k];
        el.oninput = () => change(k, el.value);
      } else if (type === 'chk') {
        el = document.createElement('input'); el.type = 'checkbox'; el.checked = !!cfg[k];
        el.onchange = () => change(k, el.checked);
      } else if (type === 'multi') {
        p.append(row.firstChild);
        el = document.createElement('div'); el.className = 'multi';
        cols.forEach(c => {
          const l = document.createElement('label');
          l.innerHTML = `<input type="checkbox"> ${c}`;
          const i = l.firstChild; i.checked = (cfg.fields || []).includes(c);
          i.onchange = () => change(k, cols.filter(x => x === c ? i.checked : (cfg.fields || []).includes(x)));
          el.append(l);
        });
        p.append(el); continue;
      }
      row.append(el); p.append(row);
    }
  }
}

/* ---------- construction de l'arbre et rendu ---------- */
function render() {
  const nodesEl = $('#nodes'), edgesEl = $('#edges'), msg = $('#msg');
  nodesEl.innerHTML = ''; edgesEl.innerHTML = ''; laid = new Map();
  if (!recs.length) { msg.style.display = 'flex'; msg.textContent = 'Aucune donnée dans la table.'; return; }
  msg.style.display = cfg.parentCol ? 'none' : 'flex';
  msg.style.alignItems = 'flex-end'; msg.style.paddingBottom = '30px';
  msg.textContent = cfg.parentCol ? '' : 'Choisissez la colonne parent dans ⚙ Configurer pour construire la hiérarchie.';

  const byId = new Map(), byKey = new Map();
  const nodes = recs.map(r => { const n = { id:r.id, r, p:[], ch:[] }; byId.set(r.id, n);
    if (cfg.keyCol && cfg.keyCol !== 'id') byKey.set(String(r[cfg.keyCol]), n); return n; });
  if (cfg.parentCol) nodes.forEach(n => {
    const v = n.r[cfg.parentCol];
    const vals = Array.isArray(v) ? v.slice(v[0] === 'L' ? 1 : 0) : [v];
    vals.forEach(x => {
      if (x === null || x === undefined || x === '' || x === 0) return;
      const t = byKey.get(String(x)) || byId.get(x) || byId.get(Number(x));
      if (t && t !== n && !n.p.includes(t)) n.p.push(t);
    });
    if (n.p[0]) n.p[0].ch.push(n);
  });

  // dimensions des vignettes
  const fields = (cfg.fields || []).filter(c => cols.includes(c));
  const showP = cfg.showParents && nodes.some(n => n.p.length);
  const W = Math.max(80, cfg.w);
  let H = 22 + 16 + fields.length * 17 + (showP ? 24 : 0);
  if (cfg.shape === 'ellipse' || cfg.shape === 'pill') H += 14;
  H = Math.max(44, H);
  const vert = cfg.orient === 'TB' || cfg.orient === 'BT';
  const bS = vert ? W : H, dS = vert ? H : W;

  // placement : feuilles côte à côte, parent centré sur ses enfants
  let cursor = 0;
  const lay = (n, d) => {
    n.vis = true; n.d = d;
    const kids = n.ch.filter(k => !k.vis);
    kids.forEach(k => lay(k, d + 1));
    if (!kids.length) { n.b = cursor; cursor += bS + cfg.gapB; }
    else n.b = (kids[0].b + kids[kids.length - 1].b) / 2;
  };
  nodes.filter(n => !n.p.length).forEach(n => lay(n, 0));
  nodes.filter(n => !n.vis).forEach(n => lay(n, 0)); // cycles éventuels

  nodes.forEach(n => {
    const dp = n.d * (dS + cfg.gapD);
    n.x = { TB:n.b, BT:n.b, LR:dp, RL:-dp }[cfg.orient];
    n.y = { TB:dp, BT:-dp, LR:n.b, RL:n.b }[cfg.orient];
  });
  const minX = Math.min(...nodes.map(n => n.x)) - 40, minY = Math.min(...nodes.map(n => n.y)) - 60;
  nodes.forEach(n => { n.x -= minX; n.y -= minY; });
  size = { w:Math.max(...nodes.map(n => n.x)) + W + 40, h:Math.max(...nodes.map(n => n.y)) + H + 40 };

  // couleurs
  const vals = [...new Set(nodes.map(n => fmt(n.r[cfg.colorCol])))];
  const fillOf = n => cfg.fillMode === 'fixed' ? cfg.fill
    : cfg.fillMode === 'column' ? PALETTE[vals.indexOf(fmt(n.r[cfg.colorCol])) % PALETTE.length]
    : PALETTE[n.d % PALETTE.length];

  // traits
  let svg = `<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="${Math.max(4, 12 / Math.max(1, cfg.eWidth) + 2)}" markerHeight="${Math.max(4, 12 / Math.max(1, cfg.eWidth) + 2)}" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>`;
  nodes.forEach(c => c.p.forEach((p, i) => {
    if (i > 0 && !cfg.secondary) return;
    let x1, y1, x2, y2;
    if (cfg.orient === 'TB') [x1, y1, x2, y2] = [p.x + W/2, p.y + H, c.x + W/2, c.y];
    else if (cfg.orient === 'BT') [x1, y1, x2, y2] = [p.x + W/2, p.y, c.x + W/2, c.y + H];
    else if (cfg.orient === 'LR') [x1, y1, x2, y2] = [p.x + W, p.y + H/2, c.x, c.y + H/2];
    else [x1, y1, x2, y2] = [p.x, p.y + H/2, c.x + W, c.y + H/2];
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const d = cfg.eShape === 'line' ? `M${x1} ${y1}L${x2} ${y2}`
      : cfg.eShape === 'curve' ? (vert ? `M${x1} ${y1}C${x1} ${my} ${x2} ${my} ${x2} ${y2}` : `M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`)
      : (vert ? `M${x1} ${y1}V${my}H${x2}V${y2}` : `M${x1} ${y1}H${mx}V${y2}H${x2}`);
    const dash = i > 0 ? '6 4' : DASH[cfg.eDash];
    svg += `<path d="${d}" fill="none" stroke="${cfg.eColor}" stroke-width="${cfg.eWidth}" stroke-linecap="round" stroke-linejoin="round"${dash ? ` stroke-dasharray="${dash}"` : ''}${i > 0 ? ' opacity=".55"' : ''}${cfg.arrow ? ' marker-end="url(#a)"' : ''}/>`;
  }));
  edgesEl.innerHTML = svg;

  // vignettes
  const title = n => fmt(n.r[cfg.title]) || '#' + n.id;
  nodes.forEach(n => {
    const el = document.createElement('div');
    const fill = fillOf(n), accent = cfg.shape === 'accent';
    el.className = 'card ' + cfg.shape + (n.id === sel ? ' sel' : '');
    el.dataset.id = n.id;
    Object.assign(el.style, { left:n.x + 'px', top:n.y + 'px', width:W + 'px', height:H + 'px', borderColor:cfg.border,
      background:accent ? '#fff' : fill, color:accent || lum(fill) > 0.5 ? '#1d2733' : '#fff',
      borderRadius:{ round:'10px', rect:'2px', pill:'26px', ellipse:'50%', accent:'6px' }[cfg.shape] });
    if (accent) { el.style.borderLeft = `8px solid ${fill === '#ffffff' ? cfg.border : fill}`; el.style.color = '#1d2733'; }
    const t = document.createElement('div'); t.className = 't'; t.textContent = title(n); el.append(t);
    fields.forEach(c => { const v = fmt(n.r[c]); if (!v) return;
      const f = document.createElement('div'); f.className = 'f'; f.innerHTML = '<b></b><span></span>';
      f.firstChild.textContent = c + ' :'; f.lastChild.textContent = v; el.append(f); });
    if (showP && n.p.length) {
      const ch = document.createElement('div'); ch.className = 'chips';
      n.p.forEach(p => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = '↑ ' + title(p); b.title = 'Aller au parent : ' + title(p);
        b.onclick = e => { e.stopPropagation(); select(p.id, true); }; ch.append(b); });
      el.append(ch);
    }
    el.onclick = () => { if (!moved) select(n.id, false); };
    nodesEl.append(el); laid.set(n.id, { x:n.x, y:n.y, W, H });
  });
  if (needFit) { needFit = false; fit(); }
}

/* ---------- sélection, zoom, déplacement ---------- */
let moved = false;
const vp = $('#vp'), stage = $('#stage');
const apply = () => stage.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
function fit() {
  const k = Math.min(vp.clientWidth / size.w, vp.clientHeight / size.h, 1);
  view = { k, x:(vp.clientWidth - size.w * k) / 2, y:(vp.clientHeight - size.h * k) / 2 }; apply();
}
function select(id, center) {
  sel = id;
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', +c.dataset.id === id));
  try { grist.setCursorPos({ rowId:id }); } catch (e) {}
  try { grist.setSelectedRows([id]); } catch (e) {}
  const n = laid.get(id);
  if (center && n) {
    view.x = vp.clientWidth / 2 - (n.x + n.W / 2) * view.k; view.y = vp.clientHeight / 2 - (n.y + n.H / 2) * view.k;
    stage.style.transition = 'transform .35s'; apply(); setTimeout(() => stage.style.transition = '', 400);
  }
}
let drag = null;
vp.onpointerdown = e => { if (e.target.closest('.chip')) return; drag = { x:e.clientX, y:e.clientY, vx:view.x, vy:view.y }; moved = false; };
window.onpointermove = e => { if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; vp.classList.add('drag'); }
  if (moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); } };
window.onpointerup = () => { drag = null; vp.classList.remove('drag'); setTimeout(() => moved = false, 0); };
const zoom = (f, mx = vp.clientWidth / 2, my = vp.clientHeight / 2) => {
  const k2 = Math.min(3, Math.max(0.1, view.k * f));
  view.x = mx - (mx - view.x) * k2 / view.k; view.y = my - (my - view.y) * k2 / view.k; view.k = k2; apply(); };
vp.onwheel = e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX, e.clientY); };
$('#b-in').onclick = () => zoom(1.2); $('#b-out').onclick = () => zoom(1 / 1.2); $('#b-fit').onclick = fit;
$('#b-cfg').onclick = () => $('#panel').classList.toggle('open');
window.onresize = () => { };

/* ---------- connexion à Grist ---------- */
grist.ready({ requiredAccess:'read table', allowSelectBy:true, onEditOptions:() => $('#panel').classList.add('open') });
grist.onRecords(r => {
  recs = r;
  cols = Object.keys(r[0] || {}).filter(k => k !== 'id' && k !== 'manualSort' && !k.startsWith('gristHelper_'));
  const before = JSON.stringify(cfg); guess();
  buildPanel(); needFit = needFit || before !== JSON.stringify(cfg); render();
  if (before !== JSON.stringify(cfg)) save();
});
grist.onOptions(o => {
  const next = { ...D, ...(o || {}) };
  if (JSON.stringify(next) === lastSaved) return; // écho de notre propre sauvegarde
  cfg = next; guess(); buildPanel(); needFit = true; render();
});
grist.onRecord(r => { if (r && r.id !== sel) { sel = r.id; document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', +c.dataset.id === sel)); } });
</script>
</body>
</html>
